<svg xmlns="http://www.w3.org/2000/svg" class="claude-art" viewBox="0 -20 990 282" role="img" aria-labelledby="claude-art-title">
<title id="claude-art-title">Four orange pixel characters: a game controller, a glowing light bulb, a heart, and a typing bubble</title>
<style>
.claude-art { --cycle: 4.8s; --ink: #1b0c08; --orange: #ffa35c; }
.claude-art .outlined { stroke: var(--ink); stroke-width: 3.6; stroke-linejoin: round; stroke-linecap: round; }
.claude-art .body { fill: var(--orange); }
.claude-art .eye { fill: #160906; }
.claude-art .lamp-glass { fill: #f4e9d1; }
.claude-art .lamp-light { fill: #ffe18a; opacity: .02; animation: claude-light var(--cycle) linear infinite; }
.claude-art .lamp-halo { opacity: 0; animation: claude-halo var(--cycle) linear infinite; }
.claude-art .filament { fill: none; stroke: #9c7447; stroke-width: 3.2; animation: claude-filament var(--cycle) linear infinite; }
.claude-art .dot-2 { opacity: 0; animation: claude-dot-two var(--cycle) step-end infinite; }
.claude-art .dot-3 { opacity: 0; animation: claude-dot-three var(--cycle) step-end infinite; }
@keyframes claude-light {
  0%, 8% { opacity: .02; }
  33.333% { opacity: .38; }
  66.667%, 99.999% { opacity: 1; }
  100% { opacity: .02; }
}
@keyframes claude-halo {
  0%, 8% { opacity: 0; }
  33.333% { opacity: .25; }
  66.667%, 99.999% { opacity: .8; }
  100% { opacity: 0; }
}
@keyframes claude-filament {
  0%, 8% { stroke: #9c7447; }
  33.333% { stroke: #e2a43d; }
  66.667%, 99.999% { stroke: #fff8d8; }
  100% { stroke: #9c7447; }
}
@keyframes claude-dot-two {
  0% { opacity: 0; }
  33.333% { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes claude-dot-three {
  0% { opacity: 0; }
  66.667% { opacity: 1; }
  100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .claude-art .lamp-light, .claude-art .lamp-halo, .claude-art .filament,
  .claude-art .dot-2, .claude-art .dot-3 { animation: none; }
  .claude-art .lamp-light { opacity: .65; }
  .claude-art .lamp-halo { opacity: .25; }
  .claude-art .dot-2, .claude-art .dot-3 { opacity: 1; }
}
</style>
<defs>
  <radialGradient id="claude-lamp-glow"><stop offset="0" stop-color="#ffd462" stop-opacity=".68"/><stop offset=".48" stop-color="#ffdc79" stop-opacity=".28"/><stop offset="1" stop-color="#ffe6a4" stop-opacity="0"/></radialGradient>
</defs>
